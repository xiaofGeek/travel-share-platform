spring:
  datasource:
    url: jdbc:h2:mem:travel_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
app:
  jwt:
    secret: travel-share-test-secret-key-that-is-long-enough-2026
    expiration-minutes: 60
  upload:
    directory: target/test-uploads
    max-bytes: 10485760
    allowed-extensions: jpg,jpeg,png,webp,gif
logging:
  level:
    root: WARN

