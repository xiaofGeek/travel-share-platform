spring:
  application:
    name: travel-share-platform
  profiles:
    active: local
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:travel-share-local-demo-secret-key-2026-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  upload:
    directory: ${UPLOAD_DIR:uploads}
    max-bytes: 10485760
    allowed-extensions: jpg,jpeg,png,webp,gif

logging:
  file:
    name: ${LOG_FILE:../logs/travel-share.log}
  level:
    root: INFO
    com.travelshare.platform: INFO

